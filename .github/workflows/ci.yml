name: CI

# 为什么要有这个:仓库里有 catalog / monitor / updater 等多个测试包,
# 但在此之前它们从来不会自动跑 —— 全靠本地记得执行。
# 而这个项目会真的花钱下单(addon 匹配错一档就是每月多付几十欧),
# 也会自己替换自己的二进制,推个坏版本上去的代价不小。
#
# 这里原本是「只手动触发」,理由写的是「自动跑会在每次 push 时占用 Actions 额度」。
# 那个理由不成立:本仓库是**公开仓库**,而公开仓库用标准 runner(ubuntu-latest
# 就是)的 Actions 时长是免费且无上限的 —— 计费只针对私有仓库和 larger runner。
# 没有额度可省,于是「只手动」的实际效果就是「从来不跑」:frontend job 在干净
# 检出上一直是必红的(routeTree.gen.ts 不入库,见该 job 的注释),
# 这条流水线要是被人跑过哪怕一次,不可能没发现。
#
# 所以改成 push 到 main / PR 自动跑。就算按私有仓库的免费额度折算,
# 两个 job 一轮 5-7 分钟 × 每月 30 次 push ≈ 200 分钟,也只占 2000 分钟的 10%。
#
# 打 v* tag 时也跑一轮。但别把它当发版闸门:产物是本地 build.sh + gh release
# 传上去的,而 gh release create 是建 tag 和发布同时完成 —— CI 被唤醒时
# 产物已经公开了。它只能在几分钟内告诉你该不该撤,拦不住任何东西。
# 真要变成闸门,得把发版本身搬进 CI。
#
# (v0.1.15 那个「点在线更新后进程直接消失」的缺陷,tag 触发其实也抓不到:
#  复现它的 restartrace_test.go 是事后修的时候才新建的,打 tag 那天仓库里没有它。
#  真正能防这类事故的是 push 触发 + 修 bug 时补测试 —— 后者作者本来就在做,
#  缺的只是「补完之后每次 push 都自动验一遍它还成立」。)
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端 (build / vet / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt 检查
        run: |
          # 只看本次仓库里的文件是否格式化,不自动改
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化,请跑 gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -short 跳过需要联网打 OVH 公开接口的用例:
      # CI 不该因为 OVH 抖动或限流就变红,那种噪音会让人开始无视 CI。
      # 联网用例在下面单独一个 job 里跑,失败不阻塞。
      - name: go test (含 race)
        run: go test -race -short ./...

      # 发版靠交叉编译出三平台产物,这里提前验编译得过。
      # 不带 -tags ui:CI 里没有 server/web/(前端产物不入库),//go:embed 会找不到目录。
      - name: 交叉编译三平台(与发版产物一致)
        run: |
          set -e
          build() {
            echo "==> $1/$2"
            GOOS="$1" GOARCH="$2" CGO_ENABLED=0 go build -trimpath -o /dev/null .
          }
          build windows amd64
          build linux amd64
          build linux arm64

  frontend:
    name: 前端 (tsc / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      # 仓库里一直写着 `"lint": "eslint ."`,也一直有 7 处
      # `// eslint-disable-next-line react-hooks/exhaustive-deps` ——
      # 也就是说代码本来就是照着「有 ESLint」写的,只是 eslint.config.js
      # 从来没进过版本库,这条命令一跑就报「couldn't find an eslint.config.js」。
      # 补上配置之后把它接进 CI,否则下次又会悄悄坏掉没人知道。
      #
      # 这一步不依赖 routeTree.gen.ts(配置里已 ignore),所以可以放在 build 前面:
      # lint 几秒钟出结果,比等完整构建再报一个未使用变量要快。
      # 当前树上是 0 error / 15 warning,warning 不让 CI 变红 —— 理由见 eslint.config.js。
      - name: ESLint
        run: npm run lint

      # 顺序不能反过来。src/routeTree.gen.ts 是 @tanstack/router-plugin 在
      # vite 跑起来时生成的,而且被 .gitignore 挡在版本库外 —— 干净检出上它不存在。
      # 先跑 tsc 的话必然是
      #   src/main.tsx: error TS2307: Cannot find module './routeTree.gen'
      # 外加十几条由它级联出来的 "'/xxx' is not assignable to type 'undefined'"。
      # 本地不会暴露:开发机上跑过一次 npm run dev,那个文件就一直躺在工作区里。
      #
      # npm run build 现在是 `vite build && tsc -b`:vite 先生成路由树
      # 并产出 server/web/,tsc 再把类型这道闸落下,build 失败仍然是非零退出。
      - name: 构建（顺带生成 routeTree.gen.ts）+ TypeScript 类型检查
        run: npm run build

  live-api:
    name: OVH 公开接口契约(允许失败)
    runs-on: ubuntu-latest
    # 这些用例真的去打 OVH 的公开目录/可用性接口,验证我们对三区差异的理解没过期
    # (比如美区 region 只接受 united_states)。OVH 侧抖动不该把 CI 弄红,
    # 所以单独成 job 且不阻塞 —— 但它变红时值得认真看一眼。
    #
    # 这个 job **不**跟着 push / PR 跑,只在手动触发和打 tag 时跑。
    # 上面两个 job 是纯本地计算,跑多少次都只花 GitHub 的机器;这个不一样,
    # 每跑一次都是真的去敲 OVH 的接口。跟着每次 push 跑有两个坏处:
    # 一是往 OVH 的限流里送(而限流撞上了就是抢购窗口里查不到库存),
    # 二是 OVH 一抖 CI 就红,那种噪音会让人开始无视 CI —— 作者原注释里
    # 担心的就是这件事,只是该限流的是这个 job,不是整条流水线。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: 联网契约测试
        run: go test -run 'Live' -v ./internal/catalog/
